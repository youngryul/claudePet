[package]
name = "ai-coding-pet"
version = "0.1.0"
description = "A desktop pet that reacts to your AI coding agent"
authors = ["youngryul"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ai_coding_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tiny_http = "0.12"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.3"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
log = "0.4"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSResponder", "NSGraphics"] }
