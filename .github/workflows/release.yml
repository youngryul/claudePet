name: Release

# Push a tag like v0.1.1 to build macOS (universal) + Windows installers
# and attach them to a draft GitHub Release. Publish the draft by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AI Coding Pet ${{ github.ref_name }}"
          releaseBody: |
            Download the installer for your OS below.

            **macOS:** open the .dmg and drag the app to Applications. If macOS says the app is damaged or from an unidentified developer, right-click the app and choose Open, or run `xattr -cr "/Applications/AI Coding Pet.app"`.
            **Windows:** run the -setup.exe. If SmartScreen appears, click More info, then Run anyway.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
